<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Dashboard — Secret Key</title>
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Mono:wght@400;700&family=Barlow+Condensed:wght@700;900&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:          #0a0c10;
            --surface:     #111318;
            --surface2:    #181c24;
            --border:      #222630;
            --border-glow: #2a3044;
            --accent:      #c084fc;
            --accent2:     #818cf8;
            --accent-dim:  rgba(192,132,252,0.10);
            --text:        #e2e8f0;
            --text-muted:  #64748b;
            --mono:        'Space Mono', monospace;
            --sans:        'Syne', sans-serif;
            --heading:     'Bungee', sans-serif;
        }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            overflow: hidden;
        }

        /* ── TOPBAR ── */
        .topbar {
            height: 62px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 24px;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
        }
        .topbar::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(192,132,252,0.2), transparent);
            pointer-events: none;
        }

        /* Tabs */
        .topbar-tabs {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .tab-btn {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px 15px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            font-family: var(--mono);
            font-size: 0.66rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.18s;
            outline: none;
        }
        .tab-btn svg {
            width: 15px;
            height: 15px;
            stroke: currentColor;
            flex-shrink: 0;
            opacity: 0.6;
            transition: opacity 0.18s;
        }
        .tab-btn:hover {
            background: var(--accent-dim);
            border-color: rgba(192,132,252,0.2);
            color: var(--text);
        }
        .tab-btn:hover svg { opacity: 0.9; }
        .tab-btn.active {
            background: var(--accent-dim);
            border-color: rgba(192,132,252,0.4);
            color: var(--accent);
        }
        .tab-btn.active svg { opacity: 1; }

        /* ── IFRAME ── */
        .iframe-wrap {
            position: fixed;
            top: 62px; left: 0; right: 0; bottom: 0;
        }
        .iframe-wrap.behind {
            pointer-events: none;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ── FADE OVERLAY ── */
        .fade-overlay {
            position: absolute;
            inset: 0;
            background: #0a0c10;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 0s;
        }
        .fade-overlay.visible {
            opacity: 1;
            transition: opacity 0s;
        }
        .fade-overlay.fading-out {
            opacity: 0;
            transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* ── HOME PAGE ── */
        .home-page {
            position: fixed;
            top: 62px; left: 0; right: 0; bottom: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg);
            z-index: 5;
            overflow: hidden;
        }
        .home-page.hidden { display: none; }

        /* Particles canvas */
        #home-canvas {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            pointer-events: none; opacity: 0.55;
        }

        /* Grid tło */
        .home-grid {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(192,132,252,0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(192,132,252,0.035) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 0%, transparent 75%);
            pointer-events: none;
        }

        /* Glow orb */
        .home-orb {
            position: absolute;
            width: 600px; height: 600px; border-radius: 50%;
            background: radial-gradient(circle, rgba(192,132,252,0.06) 0%, transparent 70%);
            top: 50%; left: 50%; transform: translate(-50%, -60%);
            pointer-events: none;
        }

        /* Treść */
        .home-content {
            position: relative; z-index: 1;
            display: flex; flex-direction: column;
            align-items: center; text-align: center;
            gap: 0; max-width: 560px; width: 100%;
            padding: 0 24px;
            animation: homeIn 0.6s cubic-bezier(0.22,1,0.36,1) both;
        }
        @keyframes homeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .home-logo {
            width: 80px; height: auto;
            filter: drop-shadow(0 0 20px rgba(192,132,252,0.55));
            animation: homeFloat 4s ease-in-out infinite;
            margin-bottom: 20px;
        }
        @keyframes homeFloat {
            0%,100% { transform: translateY(0); }
            50%      { transform: translateY(-8px); }
        }

        .home-title {
            font-family: var(--heading);
            font-size: clamp(3rem, 6vw, 4.5rem);
            font-weight: 400; letter-spacing: 0.04em; text-transform: uppercase;
            line-height: 1;
            background: linear-gradient(140deg, #ffffff 30%, var(--accent) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .home-badge {
            font-family: var(--mono); font-size: 0.58rem;
            letter-spacing: 0.2em; text-transform: uppercase;
            color: var(--accent); border: 1px solid rgba(192,132,252,0.3);
            border-radius: 99px; padding: 4px 14px; margin-bottom: 22px;
            background: rgba(192,132,252,0.07);
        }

        .home-desc {
            font-size: 0.9rem; color: var(--text-dim); line-height: 1.75;
            margin-bottom: 36px;
        }

        .home-btns {
            display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
        }

        .home-btn {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 13px 24px;
            border-radius: 12px; border: 1px solid rgba(192,132,252,0.3);
            background: linear-gradient(135deg, rgba(192,132,252,0.14), rgba(129,140,248,0.08));
            color: var(--text); font-family: var(--mono);
            font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase;
            cursor: pointer; transition: all 0.2s;
        }
        .home-btn svg {
            width: 15px; height: 15px; stroke: currentColor;
            flex-shrink: 0; opacity: 0.7;
        }
        .home-btn:hover {
            border-color: rgba(192,132,252,0.6);
            box-shadow: 0 0 24px rgba(192,132,252,0.18);
            color: #fff; transform: translateY(-2px);
        }
        .home-btn.ghost {
            background: transparent;
            border-color: var(--border);
            color: var(--text-muted);
        }
        .home-btn.ghost:hover {
            border-color: rgba(192,132,252,0.4);
            color: var(--text);
            box-shadow: none;
        }

        .home-pills {
            display: flex; gap: 8px; flex-wrap: wrap;
            justify-content: center; margin-top: 32px;
        }
        .home-pill {
            font-family: var(--mono); font-size: 0.55rem;
            letter-spacing: 0.1em; text-transform: uppercase;
            padding: 5px 12px; border-radius: 99px;
            border: 1px solid var(--border); color: var(--text-muted);
            background: var(--surface);
        }


        @media (pointer: fine) { body { cursor: default; } }
            100% { width: 110px; height: 110px; opacity: 0;    transform: translate(-50%,-50%); }
        }
    </style>
</head>

<header class="topbar">
    <nav class="topbar-tabs">
        <button class="tab-btn active" id="tab-home" onclick="switchTab('home')">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                <polyline points="9 22 9 12 15 12 15 22"/>

                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>

        </button>
        <button class="tab-btn" id="tab-shamir" onclick="switchTab('shamir')">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                <path d="M2 17l10 5 10-5"/>
                <path d="M2 12l10 5 10-5"/>
            </svg>
            Szyfrowanie
        </button>
        <button class="tab-btn" id="tab-card" onclick="switchTab('card')">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="5" width="20" height="14" rx="2"/>
                <line x1="2" y1="10" x2="22" y2="10"/>
            </svg>
            Generator kart
        </button>
    </nav>
</header>

<div class="iframe-wrap">

    <iframe id="frame-shamir" src="generate-shamir.html" title="Szyfrowanie"    style="visibility:hidden;position:absolute;top:0;left:0;width:100%;height:100%;"></iframe>
    <iframe id="frame-card"   src="generate-card.html"   title="Generator kart" style="visibility:hidden;position:absolute;top:0;left:0;width:100%;height:100%;"></iframe>
    <div class="fade-overlay" id="fade-overlay"></div>
</div>

<script>
var currentTab = 'home';

function switchTab(name) {
    if (name === currentTab) return;
    currentTab = name;

    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
    document.getElementById('tab-' + name).classList.add('active');

    var overlay     = document.getElementById('fade-overlay');
    var homePage    = document.getElementById('home-page');
    var iframeWrap  = document.querySelector('.iframe-wrap');
    var fHash       = document.getElementById('frame-hash');
    var fShamir     = document.getElementById('frame-shamir');
    var fCard       = document.getElementById('frame-card');

    overlay.classList.remove('fading-out');
    overlay.classList.add('visible');

    setTimeout(function() {
        if (name === 'home') {
            homePage.classList.remove('hidden');
            iframeWrap.classList.add('behind');
            fHash.style.visibility   = 'hidden';
            fHash.style.position     = 'absolute';
            fShamir.style.visibility = 'hidden';
            fShamir.style.position   = 'absolute';
            fCard.style.visibility   = 'hidden';
            fCard.style.position     = 'absolute';
        } else {
            homePage.classList.add('hidden');
            iframeWrap.classList.remove('behind');
            fHash.style.visibility   = name === 'hash'   ? 'visible' : 'hidden';
            fHash.style.position     = name === 'hash'   ? 'relative' : 'absolute';
            fShamir.style.visibility = name === 'shamir' ? 'visible' : 'hidden';
            fShamir.style.position   = name === 'shamir' ? 'relative' : 'absolute';
            fCard.style.visibility   = name === 'card'   ? 'visible' : 'hidden';
            fCard.style.position     = name === 'card'   ? 'relative' : 'absolute';
        }
        overlay.classList.remove('visible');
        overlay.classList.add('fading-out');
    }, 60);
}

// Stan początkowy — home widoczny, iframe-wrap nieaktywny
window.addEventListener('load', function() {
    document.querySelector('.iframe-wrap').classList.add('behind');
});

// Fade in przy pierwszym załadowaniu
window.addEventListener('load', function() {
    var overlay = document.getElementById('fade-overlay');
    overlay.classList.add('visible');
    setTimeout(function() {
        overlay.classList.remove('visible');
        overlay.classList.add('fading-out');
    }, 80);
});

// ── HOME PARTICLES ──
(function() {
    var canvas = document.getElementById('home-canvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var pts = [];
    var W, H;
    function resize() { W = canvas.width = canvas.offsetWidth; H = canvas.height = canvas.offsetHeight; }
    resize();
    window.addEventListener('resize', resize, { passive: true });
    for (var i = 0; i < 55; i++) {
        pts.push({ x: Math.random()*800, y: Math.random()*600,
            r: Math.random()*1.4+0.3, vx: (Math.random()-0.5)*0.22, vy: (Math.random()-0.5)*0.22,
            a: Math.random()*0.45+0.1, ph: Math.random()*Math.PI*2 });
    }
    function draw() {
        if (!W||!H) resize();
        ctx.clearRect(0,0,W,H);
        var now = Date.now()/1000;
        for (var i=0;i<pts.length;i++) {
            var p=pts[i];
            p.x+=p.vx; p.y+=p.vy;
            if(p.x<0)p.x=W; if(p.x>W)p.x=0; if(p.y<0)p.y=H; if(p.y>H)p.y=0;
            var a=p.a*(0.7+0.3*Math.sin(now*0.8+p.ph));
            for(var j=i+1;j<pts.length;j++){
                var q=pts[j],dx=p.x-q.x,dy=p.y-q.y,d=Math.sqrt(dx*dx+dy*dy);
                if(d<140){ctx.strokeStyle='rgba(192,132,252,'+(a*(1-d/140)*0.28)+')';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();}
            }
            ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(192,132,252,'+a+')';ctx.fill();
        }
        // Tylko gdy home jest widoczny
        if (!document.getElementById('home-page').classList.contains('hidden')) requestAnimationFrame(draw);
        else { setTimeout(function(){ if (!document.getElementById('home-page').classList.contains('hidden')) requestAnimationFrame(draw); }, 500); }
    }
    draw();
    // Restart po powrocie do home
    document.addEventListener('homeVisible', function() { draw(); });
})();
</script>
