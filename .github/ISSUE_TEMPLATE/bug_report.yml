name: "🐛 Bug report / Zgłoszenie błędu"
description: "Zgłoś błąd, żeby pomóc nam go naprawić. / Report a bug to help us fix it."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Dzięki za zgłoszenie błędu! Zanim zaczniesz, sprawdź proszę [istniejące zgłoszenia](https://github.com/mateuszkarpierz/secret-key/issues), czy problem nie został już opisany.

        Thanks for reporting a bug! Before you start, please check [existing issues](https://github.com/mateuszkarpierz/secret-key/issues) to see if it's already been reported.

        > [!CAUTION]
        > Jeśli to jest luka bezpieczeństwa, **nie zgłaszaj jej tutaj publicznie** — zobacz [Politykę bezpieczeństwa](https://github.com/mateuszkarpierz/secret-key/security/policy).
        > If this is a security vulnerability, **do not report it publicly here** — see the [Security policy](https://github.com/mateuszkarpierz/secret-key/security/policy).

  - type: textarea
    id: description
    attributes:
      label: "Opis błędu / Bug description"
      description: "Jasny i zwięzły opis problemu. / A clear and concise description of the bug."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Kroki do odtworzenia / Steps to reproduce"
      description: "Jak odtworzyć błąd? / How can we reproduce this?"
      placeholder: |
        1. Przejdź do '...' / Go to '...'
        2. Kliknij '...' / Click on '...'
        3. Zobacz błąd / See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Oczekiwane zachowanie / Expected behavior"
      description: "Co powinno się wydarzyć? / What did you expect to happen?"
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: "Komponent / Component"
      description: "Której części systemu dotyczy błąd? / Which part of the system is affected?"
      options:
        - "Panel logowania / Login panel (app/)"
        - "Panel odszyfrowania / Decrypt panel (app/decrypt/)"
        - "Dashboard offline / Offline dashboard (dashboard.html)"
        - "Generator kart / Card generator"
        - "Dokumentacja / Documentation"
        - "Strona główna / Main website"
        - "Inne / Other"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "Wersja systemu / System version"
      description: "Znajdziesz ją na stronie Releases. / You can find it on the Releases page."
      placeholder: "np. v2.0.0 / e.g. v2.0.0"
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: "Środowisko / Environment"
      description: "Wersja PHP, przeglądarka, system operacyjny itd. / PHP version, browser, OS, etc."
      placeholder: "PHP 8.2, Chrome 126, Ubuntu 22.04"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: "Dodatkowy kontekst / Additional context"
      description: "Zrzuty ekranu, logi, itp. / Screenshots, logs, etc."
    validations:
      required: false
